name: Deploy to Firebase

# Deploys the full stack to Firebase on every push to `main`:
#   - Hosting (built Vite PWA from ./dist)
#   - Cloud Functions (2nd gen, Node 22)
#   - Firestore (security rules + vector index)
#
# Required GitHub repository secrets (see README > Continuous Deployment):
#   FIREBASE_SERVICE_ACCOUNT_MYAIPA2026   Google service account JSON (auth)
#   VITE_FIREBASE_API_KEY                 } Firebase web-app config (from
#   VITE_FIREBASE_AUTH_DOMAIN             } Firebase Console > Project settings
#   VITE_FIREBASE_PROJECT_ID              } > Your apps > Web app). These are
#   VITE_FIREBASE_STORAGE_BUCKET          } public client config, not server
#   VITE_FIREBASE_MESSAGING_SENDER_ID     } secrets — they ship in the bundle.
#   VITE_FIREBASE_APP_ID                  }
#
# The GEMINI_API_KEY used by the `processNote`/`ask` functions is NOT passed
# through CI. Set it once locally with `firebase functions:secrets:set
# GEMINI_API_KEY`; subsequent deploys bind it from Secret Manager automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid two concurrent production deploys clobbering each other.
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy (hosting + functions + firestore)
    runs-on: ubuntu-latest
    env:
      # Surface as job-level env so the `firebase deploy` predeploy hooks
      # (which re-run `npm run build`) see them too.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Type-check & build web app
        run: npm run build

      - name: Build functions
        run: npm --prefix functions run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYAIPA2026 }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --only hosting,functions,firestore --non-interactive

      - name: Print hosting URL
        run: |
          echo "::notice::Deployed to https://${{ secrets.VITE_FIREBASE_PROJECT_ID || 'myaipa2026' }}.web.app"
